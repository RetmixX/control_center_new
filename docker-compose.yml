x-mysql-root-password: &mysql-root-password "${MYSQL_ROOT_PASSWORD:-iot-root-change-me}"

x-mysql-common: &mysql-common
  image: mysql:8.4
  restart: unless-stopped
  command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  healthcheck:
    test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 20s

x-phpmyadmin-common: &phpmyadmin-common
  image: phpmyadmin:5.2.2
  restart: unless-stopped

x-registration-common: &registration-common
  build:
    context: .
    dockerfile: docker/node-red/Dockerfile
  image: iot-controlcenter-nodered:local
  entrypoint: ["node", "/usr/src/node-red/registration.js"]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

x-nodered-common: &nodered-common
  build:
    context: .
    dockerfile: docker/node-red/Dockerfile
  image: iot-controlcenter-nodered:local
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1880/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-controlcenter-common: &controlcenter-common
  build:
    context: .
    dockerfile: Dockerfile
  image: iot-controlcenter:local
  restart: unless-stopped
  init: true
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/state', timeout=2)"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  mysql-1:
    <<: *mysql-common
    profiles: ["zone1"]
    environment:
      MYSQL_ROOT_PASSWORD: *mysql-root-password
    volumes:
      - mysql-data-1:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT_1:-3307}:3306"
    networks: [zone1]

  registration-1:
    <<: *registration-common
    profiles: ["zone1"]
    environment:
      MYSQL_HOST: mysql-1
      MYSQL_ROOT_PASSWORD: *mysql-root-password
      NODE_RED_PORT: "${NODERED_PORT_1:-1881}"
      NODE_RED_URL: "${NODERED_URL_1:-}"
    volumes:
      - accounts-data-1:/config
    ports:
      - "${REGISTRATION_PORT_1:-3001}:3000"
    depends_on:
      mysql-1:
        condition: service_healthy
    networks: [zone1]

  nodered-1:
    <<: *nodered-common
    profiles: ["zone1"]
    environment:
      NODE_RED_CREDENTIAL_SECRET: "${NODE_RED_CREDENTIAL_SECRET_1:-zone1-change-me}"
      REGISTRATION_URL: http://registration-1:3000/auth
    volumes:
      - nodered-data-1:/data
      - ./docker/node-red/settings.js:/data/settings.js:ro
    ports:
      - "${NODERED_PORT_1:-1881}:1880"
    depends_on:
      registration-1:
        condition: service_healthy
    networks: [zone1]

  controlcenter-1:
    <<: *controlcenter-common
    profiles: ["zone1"]
    command: ["python", "-m", "controlcenter", "--dir", "/data", "--no-console", "--team", "1", "--nodered-ip", "nodered-1", "--equipment"]
    volumes:
      - controlcenter-data-1:/data
    ports:
      - "${CONTROLCENTER_PORT_1:-8081}:8080"
      - "${CONTROLCENTER_UDP_PORT_1:-8881}:8888/udp"
    depends_on:
      nodered-1:
        condition: service_healthy
    networks: [zone1]

